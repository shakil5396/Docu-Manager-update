<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091321"><title>Choose a new password · Folio Vault</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsible.css"></head><body class="vault-app auth-page"><main class="reset-layout"><a class="vault-brand" href="index.html"><img src="Assets/logo.png" alt=""><span><b>Folio</b><small>DOCUMENT VAULT</small></span></a><section class="reset-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a new password</h1><p class="auth-intro">Use at least 8 characters. This will sign out your other sessions.</p><div id="resetMessage" class="auth-message" role="status" hidden></div><form id="resetForm" class="auth-form"><label>New password<input type="password" name="password" minlength="8" maxlength="200" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="confirmPassword" minlength="8" maxlength="200" autocomplete="new-password" required></label><button class="button button-primary auth-submit" type="submit">Update password</button></form><a class="forgot-link" href="index.html">Return to sign in</a></section></main><script src="js/password-reset.js" defer></script></body></html>
